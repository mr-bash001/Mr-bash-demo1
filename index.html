<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr_Bash Demo</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#08090d;
    color:white;
}

nav{
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#0d0f16;
    border-bottom:1px solid #242735;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.logo span{
    color:#8b5cf6;
}

nav a{
    color:#bbb;
    text-decoration:none;
    margin-left:18px;
}

.hero{
    min-height:80vh;
    padding:80px 7%;
    display:flex;
    align-items:center;
    background:
    radial-gradient(circle at 80% 20%,#39206b,transparent 35%),
    radial-gradient(circle at 20% 80%,#12314a,transparent 35%);
}

.hero-content{
    max-width:700px;
}

.tag{
    color:#a78bfa;
    font-weight:bold;
    letter-spacing:2px;
}

h1{
    font-size:clamp(50px,10vw,90px);
    line-height:.95;
    margin:20px 0;
}

h1 span{
    color:#8b5cf6;
}

.hero p{
    color:#aeb5c4;
    font-size:18px;
    line-height:1.7;
}

.buttons{
    margin-top:30px;
}

.btn{
    display:inline-block;
    padding:14px 22px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
    margin-right:10px;
    margin-bottom:10px;
}

.primary{
    background:#8b5cf6;
    color:white;
}

.secondary{
    border:1px solid #363b4b;
    color:white;
}

section{
    padding:70px 7%;
    max-width:1200px;
    margin:auto;
}

.title{
    text-align:center;
    margin-bottom:35px;
}

.title h2{
    font-size:35px;
}

.title p{
    color:#8e96a8;
    margin-top:8px;
}
