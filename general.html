<!DOCTYPE html>
<html>

<head>
<title>Mr_Bash General Chat</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
padding:30px;
}

.container{
max-width:600px;
margin:auto;
}

.chat{
background:#1d1d1d;
padding:20px;
border-radius:12px;
min-height:300px;
}

.message{
background:#292929;
padding:12px;
margin:10px 0;
border-radius:8px;
}

input{
width:100%;
padding:14px;
box-sizing:border-box;
border-radius:8px;
border:none;
margin-top:15px;
}

.button{
display:block;
background:#333;
color:white;
padding:14px;
margin-top:10px;
border-radius:8px;
text-decoration:none;
text-align:center;
border:none;
width:100%;
}

</style>

</head>

<body>

<div class="container">

<h1>💬 General Chat</h1>

<p>Welcome to the Mr_Bash community chat.</p>

<div class="chat">

<div class="message">
👑 Mr_Bash: Welcome everyone!
</div>

<div class="message">
🛡️ Admin: Please follow the server rules.
</div>

</div>

<input
type="text"
placeholder="Type a message..."
>

<button class="button">
📤 Send Message
</button>

<a class="button" href="index.html">
⬅️ Back to Home
</a>

</div>

</body>

</html>
